# NIF Dante 1 viewing the whole target: the channels and line of sight of nif_dante1, the
# rays cast over the collimated field of view instead of through the lower entrance hole,
# so a halfraum pair's walls, a package or a shield in the field count, occluded by every
# part (assemblies design, decision 10). The field is the 2004 design's ±30 mm at TCC
# (Dewald et al., RSI 75, 3759 (2004), OSTI 15014120; research notes, "Dante-family
# hardware and geometry", confidence H for the design). The collimators as fielded are not
# public (Girard et al. 2009 describe a "centimeter-wide" field), nor is any channel's
# own field except the multilayer channel's 12 mm (Rubery et al. 2022): a user file that
# extends this one narrows it. Tr stays over the lower entrance hole's initial area,
# Dante's convention.

schema = 1
id = "nif_dante1_field"
extends = "nif_dante1"
name = "NIF Dante 1, whole target (60 mm field)"
source = "Dewald et al., RSI 75, 3759 (2004): field of view ±30 mm at TCC (2004 design)"
confidence = "H"

[view]
field_of_view_mm = 60.0
through = "leh_bottom"
