# Omega Dante as configured at the time of Rubery et al., RSI (2023), OSTI 1975922, Fig. 13
# (channels 1 and 2 then offline), read from the page image. Public: filters, mirrors,
# XRD cathodes, nominal energies, XRD apertures (ch 1 10.5 mm, ch 2–4 8.3 mm, ch 5–18
# 13.2 mm) and the port. Not public: the standoff, so no solid angles (Ω = aperture area /
# standoff²): supply solid_angle_sr in a file that extends this one. Mirrors (carbon,
# beryllium) as uncalibrated Fresnel mirrors; the XRD cathodes as NIF's XRD-31 model
# (assumed). The hohlraum axis on Omega is P6–P7 or P5–P8 (37.37° to this line of
# sight, May et al. 2012), not the chamber's z axis: place the target accordingly.

schema = 1
id = "omega_dante"
name = "Omega Dante"
kind = "xray_power"
facility = "Omega"
public = true
source = "Rubery et al., RSI (2023), OSTI 1975922, Fig. 13 and §IV"
confidence = "H"

[line_of_sight]
theta_deg = 142.62
phi_deg = 126.0
source = "Rubery et al. (2023) §IV: port H16I"

[view]
through = "leh_bottom"

[recording]
mode = "history"

