# NIF Sentinel on shot N170924-003, with 16 MiniXRD channels and no mirrors. The filters
# were chosen to emulate the Dante 2 of that shot without its mirror channels. The public
# values are from Kemp et al. (2020), OSTI 1736345, Table II, read from the page image, with
# the "35% transmission sieve" as grid = 0.35. Two values are not public and so are absent.
# One is the equatorial DIM it was fielded on (90-78 or 90-315, for phi_deg). The other is
# the responsivity of the MiniXRDs; the cross-calibration against Dante on this shot needed
# the Al MiniXRDs to be 3–4 times as responsive as an XRD-31. Supply cathode, to use the
# XRD-31 model, or sensitivity_csv per channel. The solid angle, 2.633e-7 sr, is derived
# from the 12.9 mm² entrance at ≈ 7 m (Kemp 2020 §II). No nominal energies are published, so
# the nominal energy of each channel is the peak of its response.

schema = 1
id = "nif_sentinel_N170924"
name = "NIF Sentinel (N170924-003)"
kind = "xray_power"
facility = "NIF"
instrument = "NIF Sentinel"
public = true
shots = ["N170924-003"]
source = "Kemp et al. (2020), OSTI 1736345, Table II and §II"
confidence = "H"

[line_of_sight]
theta_deg = 90.0
note = "an equatorial DIM, 90-78 (phi 78.75) or 90-315 (phi 315); which one is not published"

[recording]
mode = "history"

[[channel]]
number = 1
filters = [{ material = "Mg", thickness_um = 22 }]
solid_angle_sr = 2.633e-7
note = "MiniXRD, Ni"

[[channel]]
number = 2
filters = [{ material = "Mn", thickness_um = 13.2 }, { material = "Ni", thickness_um = 1.8 }]
solid_angle_sr = 2.633e-7
