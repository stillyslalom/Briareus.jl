# NIF Sentinel on shot N170924-003 (16 MiniXRD channels, no mirrors; filters chosen to
# emulate that shot's Dante 2 without its mirror channels). Public values: Kemp et al.
# (2020), OSTI 1736345, Table II, read from the page image; "35 % transmission sieve" as
# grid = 0.35. Not public, so absent: the equatorial DIM it was fielded on (90-78 or
# 90-315: phi_deg), and the MiniXRDs' responsivity (the cross-calibration against Dante on
# this shot needed the Al MiniXRDs 3–4 times as responsive as an XRD-31): supply cathode
# (to take the XRD-31 model) or sensitivity_csv per channel. Solid angle derived: the
# 12.9 mm² entrance at ≈ 7 m (Kemp 2020 §II), 2.633e-7 sr. No nominal energies are
# published: each channel takes its response's peak.

schema = 1
id = "nif_sentinel_N170924"
name = "NIF Sentinel (N170924-003)"
kind = "xray_power"
facility = "NIF"
public = true
shots = ["N170924-003"]
source = "Kemp et al. (2020), OSTI 1736345, Table II and §II"
confidence = "H"

[line_of_sight]
theta_deg = 90.0
note = "an equatorial DIM, 90-78 (phi 78.75) or 90-315 (phi 315); which one is not published"

[recording]
