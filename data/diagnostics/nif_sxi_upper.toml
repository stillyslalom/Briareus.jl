name = "NIF SXI upper (hard channel)"
instrument = "NIF SXI upper"
source = "Schneider et al. (2012), OSTI 1043636, §II (draft); Schneider et al. (2010)"
confidence = "M"

[line_of_sight]
port = "P18-123"
source = "NIF User Guide (2024-09), Table 5-1"

[optic]
distance_mm = 1626.7
note = "distance derived: detector 4.88 m from the target at 2x"
