name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} threads${{ matrix.shard && format(' - shard {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      # the one-thread job runs as three shards (test/runtests.jl); unset elsewhere: all tests
      BRIAREUS_TEST_SHARD: ${{ matrix.shard }}
      # the statistical and convergence checks (test/runtests.jl) run on the shards, which
      # finish well before the documentation job
      BRIAREUS_LONG_TESTS: ${{ matrix.shard && 'true' || 'false' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        threads:
          - '4'
        include:
          - version: 'lts'
            os: ubuntu-latest
            threads: '1'
            shard: '1'
          - version: 'lts'
            os: ubuntu-latest
            threads: '1'
            shard: '2'
          - version: 'lts'
            os: ubuntu-latest
            threads: '1'
            shard: '3'
          - version: '1'
            os: windows-latest
            threads: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage is not uploaded, and Julia 1.13 miscompiles the inlined
          # point-to-polygon view-factor kernel under --code-coverage (wrong values).
          coverage: false
  gui:
    name: BriareusGUI - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Install GL system libraries
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Develop the core package into the GUI environment
        # [sources] needs Julia 1.11, so develop the core explicitly. Precompilation
        # waits for the test step, where xvfb provides the display GLMakie needs.
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        shell: julia --project=BriareusGUI --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Run BriareusGUI tests
        # QML.jl creates a Qt application when it loads; no test opens a Qt window
        # unless BRIAREUSGUI_QT_TESTS is set, so Qt needs no X server.
        env:
          QT_QPA_PLATFORM: offscreen
          JULIA_NUM_THREADS: '4'
        run: >
          xvfb-run -s '-screen 0 1024x768x24'
          julia --color=yes --project=BriareusGUI -e 'using Pkg; Pkg.test()'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: 'auto'
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
