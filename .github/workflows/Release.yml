# Relocatable `briareus` applications (dev/release/README.md): one PackageCompiler build
# per platform, a smoke test of each as a user without Julia would run it, and the archive
# as a workflow artifact. Signing runs only where its secrets are set; a release on GitHub
# is drafted by hand from the artifacts. Compiling the system image was killed at 13.5 GB
# of resident memory on Linux in every configuration tried, one code-generation thread and
# no window included (dev/release/README.md), so the 16 GB and 7 GB standard runners are
# likely to run out of memory: larger runners (32 GB) are the expected fix.
name: Release
on:
  push:
    tags: ['BriareusGUI-v*']
  workflow_dispatch:
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    env:
      # a step's `if` cannot read secrets: these say which signing secrets are set
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install GL system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Install PackageCompiler
        run: julia --project=dev/release -e 'using Pkg; Pkg.instantiate()'
      - name: Build
        env:
          JULIA_NUM_THREADS: '4'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -s '-screen 0 1600x1000x24' julia --project=dev/release dev/release/build.jl build/Briareus
          else
            julia --project=dev/release dev/release/build.jl build/Briareus
          fi
      - name: Smoke test without Julia
        run: dev/release/smoke.sh build/Briareus smoke
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 -d > cert.pfx
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
          "$signtool" sign //f cert.pfx //p "$WINDOWS_CERTIFICATE_PASSWORD" //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 build/Briareus/bin/briareus.exe
          rm cert.pfx
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: dev/release/sign_macos.sh build/Briareus
      - name: Archive
        run: |
          cd build
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "../briareus-${{ matrix.name }}.zip" Briareus
          else
            tar czf "../briareus-${{ matrix.name }}.tar.gz" Briareus
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: briareus-${{ matrix.name }}
          path: |
            briareus-${{ matrix.name }}.*
            build/Briareus.dmg
          if-no-files-found: error
          retention-days: 30
